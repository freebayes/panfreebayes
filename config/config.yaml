# panfreebayes Snakemake workflow configuration.
#
# Copy/edit this file (or pass --configfile path/to/yours.yaml) before running.
# Every value here maps directly onto a parameter already established and
# validated in scripts/panfreebayes/*.sh -- see
# panfreebayes_milestone6_snakemake_progress.md for which values are
# "confirmed" (instructed/validated elsewhere) vs. this workflow's own choice.

# --- Inputs -----------------------------------------------------------------
graph: "/home/hasitha/data/projects/graph_freebayes/pggb_2strain_test/pggb_out_by_chrom_vcf/chrII/chrII_dl238_my2693.fasta.gz.bf3285f.11fba48.e3aa42b.smooth.final.og"
deconstruct_vcf: "/home/hasitha/data/projects/graph_freebayes/pggb_2strain_test/pggb_out_by_chrom_vcf/chrII/chrII_dl238_my2693.fasta.gz.bf3285f.11fba48.e3aa42b.smooth.final.DL238.vcf"
# deconstruct_vcf is required by the Snakefile's config check even when only
# running path_mode (which never actually reads it) -- known rough edge, the
# required-key check isn't mode-aware; harmless to just supply the real file.

strains:
  DL238:  "/home/hasitha/data/projects/graph_freebayes/pggb_2strain_test/fastq/DL238_SRR13448210.fastq"
  MY2693: "/home/hasitha/data/projects/graph_freebayes/pggb_2strain_test/fastq/MY2693_SRR13448197.fastq"
  # one entry per strain; every strain is aligned against every discovered
  # bubble's extracted reference independently (fan-out = strains x bubbles)

# --- Stage 1: bubble discovery ------------------------------------------
min_size_diff: 500   # STRICT >, confirmed manual-pipeline threshold -- do not change casually
bubble_limit:         # null/empty = no cap; set an integer to keep only the N largest-size-diff bubbles

# --- Stage 2: region extraction ------------------------------------------
padding: 5000         # odgi extract -c

# --- Alternative to stages 1-2: whole-path extraction ------------------------
# Only used by `snakemake path_mode` (see workflow/Snakefile), not
# `rule bubble_mode`. Takes one entire named path from the graph as a
# complete reference instead of a bubble -- no discovery, no padding. Leave
# empty/omit if not using this mode.
whole_paths:
  - "DL238#1#chrII_JAFETN010000011.1"   # confirmed real path name in this graph (seen in the earlier validated run's VCF/FASTA)

# --- Stage 3: alignment ---------------------------------------------------
minimap2_threads: 4   # minimap2 -t; samtools sort gets no -@, matching align_region.sh exactly
minimap2_preset: "map-pb"   # minimap2 -ax value; map-pb (PacBio CLR, the data this was validated against),
                             # map-hifi (PacBio HiFi), map-ont (Nanopore), sr (short reads) -- change this,
                             # not the rule, to point the workflow at a different sequencing technology

# --- Stage 4: variant calling ----------------------------------------------
panfreebayes_bin: "build/panfreebayes"   # pre-built path; the workflow does not build it (see progress doc)
freebayes_bin: "build/freebayes"          # stock freebayes, built alongside panfreebayes by the same `ninja -C build`;
                                           # only used by the optional call_variants_freebayes equivalence rule, not bubble_mode/path_mode
calling_flags:                            # forwarded verbatim after "--"; list form avoids shell-quoting ambiguity
  - "--pooled-continuous"
  - "--min-alternate-count"
  - "2"
  - "--min-alternate-fraction"
  - "0.2"
  - "--limit-coverage"
  - "200"

# --- Output -----------------------------------------------------------------
results_dir: "results_path_mode"   # all rule outputs written under here; a fresh dir, since path_mode's whole-chromosome
                                    # run is a much bigger computation than anything run against results_real_validation/ so far
